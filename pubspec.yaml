name: zemote
description: >-
  Zemote - mobile remote control client for ZCode desktop (protocol
  reimplementation). Manage multiple desktops: tasks, Conversation V4 chat,
  file changes, model providers and usage quotas.
publish_to: "none"
version: 0.10.0+21

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.1
  crypto: ^3.0.5
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.2
  mobile_scanner: ^7.4.0
  image_picker: ^1.2.3
  zxing2: ^0.2.4
  image: ^4.9.1
  file_picker: ^12.0.0
  flutter_markdown_plus: ^1.0.12
  markdown: ^7.3.1
  http: ^1.6.0
  path_provider: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B1220"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B1220"
    theme_color: "#0B1220"

flutter:
  uses-material-design: true

  fonts:
    - family: Sarasa UI SC
      fonts:
        - asset: assets/fonts/ZemoteS-UI-Regular.ttf
        - asset: assets/fonts/ZemoteS-UI-Bold.ttf
          weight: 700
    - family: Sarasa Term SC
      fonts:
        - asset: assets/fonts/ZemoteS-Term-Regular.ttf

  assets:
    - assets/icon/icon.png
